[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "gpsmerge"
version = "0.1.0"
description = "Offline, local-first CLI to merge GPX, TCX, and FIT activity files."
authors = [
    { name = "Sam Apoola", email = "177226958+sapoola@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["gps", "gpx", "tcx", "fit", "strava", "garmin", "merge", "cycling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "questionary>=2.1.0",
    "rich>=13.0.0",
    "pydantic>=2.6.0",
    "gpxpy>=1.6.0",
    "lxml>=6.1.0",
    "fitdecode>=0.11.0",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/sapoola/gpsmerge"
Repository = "https://github.com/sapoola/gpsmerge"
Changelog = "https://github.com/sapoola/gpsmerge/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "fit-tool>=0.9.0",  # test-only: builds tiny FIT fixtures for the reader tests
]
dev = [
    { include-group = "test" },
    "pre-commit>=3.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.5.0",
    "lxml-stubs>=0.5.0",
]

[project.scripts]
gpsmerge = "gpsmerge.cli:main"

[tool.poetry]
packages = [{ include = "gpsmerge", from = "src" }]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests exercising multiple components",
]

[tool.coverage.run]
branch = true
source = ["src/gpsmerge"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]
