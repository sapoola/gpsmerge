name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. No write scopes are needed here;
# publishing lives in release.yml with its own narrowly-scoped permissions.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref,
# so superseded PR/branch runs don't queue up and waste minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: black
        run: uv run black --check .

      - name: isort
        run: uv run isort --check-only .

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # Run the fast suite on every leg, but only gate coverage on one leg so
      # the default local run stays quick and a single version owns the report.
      - name: pytest
        if: matrix.python-version != '3.12'
        run: uv run pytest

      - name: pytest (with coverage)
        if: matrix.python-version == '3.12'
        run: >-
          uv run pytest
          --cov=gpsmerge
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*
