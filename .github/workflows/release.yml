name: Release

# Dormant until the maintainer opts in by pushing a version tag (e.g. v1.0.0).
# Nothing runs on ordinary pushes or PRs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Build sdist and wheel
        run: poetry build

      - name: Check distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI Trusted Publishing: PyPI mints a short-lived token from this run's
    # OIDC identity, so no API token secret is stored in the repo. Configure the
    # publisher and the "pypi" environment on PyPI before the first release.
    environment:
      name: pypi
      url: https://pypi.org/project/gpsmerge/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
